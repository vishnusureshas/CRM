name: CI — CRM Platform (Render + Vercel)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint • prisma • test • health
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        run: npm ci

      - name: Prisma generate (no DB needed)
        run: npx prisma generate

      - name: ESLint
        run: npm run lint
        continue-on-error: true

      - name: Vitest
        run: npm test
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crm
          JWT_ACCESS_SECRET: ci-access-secret-change-me-min-32-chars-long-12345
          JWT_REFRESH_SECRET: ci-refresh-secret-change-me-min-32-chars-long-67890
          REDIS_URL: redis://localhost:6379
          FRONTEND_URL: http://localhost:5173
          NODE_ENV: test

  frontend:
    name: Frontend — typecheck • build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Typecheck + Vite build
        run: npm run build
        env:
          VITE_API_URL: https://crm-backend-4c4g.onrender.com/api/v1

  verify-deploy:
    name: Verify Render + Vercel health (post-push only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Wait for Render to become ready (5 min max)
        run: |
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/h.json -w "%{http_code}" https://crm-backend-4c4g.onrender.com/health || true)
            cat /tmp/h.json; echo " HTTP $CODE"
            if [ "$CODE" = "200" ]; then echo "Backend healthy"; exit 0; fi
            sleep 10
          done
          echo "Backend not healthy in time"; cat /tmp/h.json; exit 1

      - name: Check frontend reachable
        run: curl -fsSL https://crm-beta-lime.vercel.app/ | head -c 500
