services:
  postgres:
    image: postgres:15-alpine
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - crm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: crm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    command: redis-server --appendonly yes --save 900 1

  backend:
    build: .
    container_name: crm-backend
    restart: unless-stopped
    expose:
      - "10000"
    # Do not publish backend directly in production — expose via nginx reverse proxy (80)
    # For local dev without nginx: uncomment ports below
    # ports:
    #   - "5000:10000"
    env_file:
      - .env
    environment:
      PORT: 10000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:10000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: crm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # For HTTPS mount certs and uncomment in nginx.conf:
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Frontend SPA — optional: mount built dist at /usr/share/nginx/html
      # Build frontend locally: npm run build --prefix ../frontend
      # then uncomment:
      # - ../frontend/dist:/usr/share/nginx/html:ro
      # - ./nginx/certs:/etc/nginx/certs:ro  # for TLS
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  crm-network:
    driver: bridge
    name: crm-network

volumes:
  pgdata:
    driver: local
    name: crm-pgdata
  redis_data:
    driver: local
    name: crm-redis-data
