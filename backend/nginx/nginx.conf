# PulseCRM — NGINX Reverse Proxy + Load Balancer (Production)
# Usage: docker compose up -d  → nginx :80 proxies /api/* → backend:10000 and / → frontend or static
# On Render/Vercel this file is not used (Cloudflare/Vercel Edge handles proxy). For Docker self-host it is the entrypoint.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;
  client_max_body_size 10m;

  # Gzip — CRM JSON + Vite assets
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;
  gzip_comp_level 6;

  # Rate limit — API brute force (login/register)
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

  upstream crm_backend {
    # For horizontal scale add more backends: server backend2:10000 max_fails=3 fail_timeout=30s;
    server backend:10000 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    # Security headers — matches backend helmet()
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Health — for Docker HEALTHCHECK and UptimeRobot
    location = /health {
      proxy_pass http://crm_backend/health;
      proxy_http_version 1.1;
      access_log off;
    }
    location = /ready {
      proxy_pass http://crm_backend/ready;
      proxy_http_version 1.1;
      access_log off;
    }

    # API — reverse proxy to Node/Express (keep /api prefix)
    location /api/ {
      limit_req zone=api burst=40 nodelay;

      proxy_pass http://crm_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_connect_timeout 10s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;

      # For auth cookies (SameSite=None; Secure) when frontend is cross-origin via Vercel,
      # this path is still same-origin when frontend is served via nginx (recommended for Docker).
    }

    # Auth burst limit (stricter)
    location = /api/v1/auth/login {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://crm_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/v1/auth/register {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://crm_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Frontend SPA — if frontend dist is mounted at /usr/share/nginx/html (see docker-compose frontend service)
    # Otherwise, proxy to Vercel or serve 502 with helpful message
    location / {
      # Try static files first (when frontend volume is mounted)
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;

      # If no static files present, fallback to backend root (shows {health,api})
      # Comment next line if frontend is not mounted — it will just serve 404
      error_page 404 = @backend_root;
    }

    location @backend_root {
      proxy_pass http://crm_backend/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Block hidden files
    location ~ /\. { deny all; access_log off; log_not_found off; }
  }

  # HTTPS template — uncomment when certs are mounted at /etc/nginx/certs
  # server {
  #   listen 443 ssl http2;
  #   server_name your-domain.com;
  #   ssl_certificate /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #   location / { proxy_pass http://crm_backend; }
  # }
}
